{% extends "base.html" %}
{% block title %}Set new password{% endblock %}
{% block content %}
  <h1>Set new password</h1>
  {% if validlink %}
    <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Change password</button></form>
  {% else %}
    <p>The reset link is invalid or expired. <a href="{% url 'password_reset' %}">Request a new one</a></p>
  {% endif %}
{% endblock %}
