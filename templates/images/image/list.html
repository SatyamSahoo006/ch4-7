{% extends "base.html" %}
{% block title %}Images{% endblock %}
{% block content %}
  <h1>Images</h1>
  <div id="image-list">
    {% include "images/image/list_ajax.html" %}
  </div>
{% endblock %}
{% block extra_head %}
<script>
let page = 1;
let emptyPage = false;
let blockRequest = false;
window.addEventListener('scroll', function() {
  if (blockRequest || emptyPage) return;
  const margin = document.body.offsetHeight - window.innerHeight - 200;
  if (window.scrollY > margin) {
    blockRequest = true;
    page += 1;
    fetch('?images_only=1&page=' + page)
      .then(r => r.text())
      .then(html => {
        if (html === '') { emptyPage = true; return; }
        document.getElementById('image-list').insertAdjacentHTML('beforeend', html);
        blockRequest = false;
      });
  }
});
</script>
{% endblock %}
